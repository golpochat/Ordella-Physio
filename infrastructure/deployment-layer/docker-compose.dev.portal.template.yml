# Portal microservices — opt-in via --profile portal
# Merged into docker-compose.dev.yml by scripts/docker/sync-compose.mjs
# Regenerate: node scripts/docker/generate-portal-template.mjs

  tenant-service:
    profiles: ["portal"]
    container_name: ordella-physio-tenant-service
    build:
      context: ./services/tenant-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-tenant-service:dev
    environment:
      PORT: 3052
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_tenant?schema=public
      JWT_SECRET: *jwt-secret
      JWT_ACCESS_SECRET: *jwt-secret
      AUTH_SERVICE_URL: http://core-service:3051
      ORGANIZATION_SERVICE_URL: http://organization-service:3066
      USER_ROLE_SERVICE_URL: http://user-role-service:3068
      AUDIT_SERVICE_URL: http://audit-service:3070
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      core-service:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - ordella-physio-network

  nats:
    profiles: ["portal"]
    container_name: ordella-physio-nats
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - ordella-physio-network

  marketplace-service:
    profiles: ["portal"]
    container_name: ordella-physio-marketplace-service
    build:
      context: ./services/marketplace-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-marketplace-service:dev
    environment:
      PORT: 3064
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_marketplace?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      MARKETPLACE_OAUTH_CALLBACK_URL: http://localhost:3049/marketplace/oauth/redirect
      MARKETPLACE_FRONTEND_CALLBACK_URL: http://localhost:3010/clinic/marketplace/oauth/callback
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ordella-physio-network

  enterprise-service:
    profiles: ["portal"]
    container_name: ordella-physio-enterprise-service
    build:
      context: ./services/enterprise-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-enterprise-service:dev
    environment:
      PORT: 3065
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_enterprise?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      SSO_ENCRYPTION_KEY: *jwt-secret
      ORGANIZATION_SERVICE_URL: http://organization-service:3066
      AUTH_SERVICE_URL: http://core-service:3051
      ENTERPRISE_SSO_CALLBACK_URL: http://localhost:3049/enterprise/sso/oauth/callback
      ENTERPRISE_SAML_ACS_URL: http://localhost:3049/enterprise/sso/saml/acs
      ENTERPRISE_FRONTEND_CALLBACK_URL: http://localhost:3010/clinic/enterprise/sso/callback
      TENANT_SERVICE_URL: http://tenant-service:3052
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
      organization-service:
        condition: service_started
    networks:
      - ordella-physio-network

  patient-service:
    profiles: ["portal"]
    container_name: ordella-physio-patient-service
    build:
      context: ./services/patient-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-patient-service:dev
    environment:
      PORT: 3053
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_patient?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      TENANT_SERVICE_URL: http://tenant-service:3052
      BILLING_SERVICE_URL: http://billing-service:3056
      FILE_STORAGE_SERVICE_URL: http://file-storage-service:3071
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
      file-storage-service:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - ordella-physio-network

  appointment-service:
    profiles: ["portal"]
    container_name: ordella-physio-appointment-service
    build:
      context: ./services/appointment-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-appointment-service:dev
    environment:
      PORT: 3054
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_appointment?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      TENANT_SERVICE_URL: http://tenant-service:3052
      PATIENT_SERVICE_URL: http://patient-service:3053
      STAFF_SERVICE_URL: http://staff-service:3069
      BILLING_SERVICE_URL: http://billing-service:3056
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
      patient-service:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - ordella-physio-network

  billing-service:
    profiles: ["portal"]
    container_name: ordella-physio-billing-service
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-billing-service:dev
    environment:
      PORT: 3056
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_billing?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_dev_stripe_secret_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_local_dev_stripe_webhook_secret}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-price_local_starter}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-price_local_pro}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-price_local_enterprise}
      STRIPE_PRICE_AI_NOTES: ${STRIPE_PRICE_AI_NOTES:-price_local_ai_notes}
      TENANT_SERVICE_URL: http://tenant-service:3052
      ORGANIZATION_SERVICE_URL: http://organization-service:3066
      FRONTEND_URL: http://localhost:3010
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - ordella-physio-network

  notification-service:
    profiles: ["portal"]
    container_name: ordella-physio-notification-service
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-notification-service:dev
    environment:
      PORT: 3062
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_notification?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      NATS_URL: nats://nats:4222
      NOTIFICATION_PROVIDER_SERVICE_URL: http://notification-provider-service:3072
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
      notification-provider-service:
        condition: service_started
    networks:
      - ordella-physio-network

  notification-provider-service:
    profiles: ["portal"]
    container_name: ordella-physio-notification-provider-service
    build:
      context: ./services/notification-provider
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-notification-provider-service:dev
    environment:
      PORT: 3072
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_notification_provider?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ordella-physio-network

  reporting-service:
    profiles: ["portal"]
    container_name: ordella-physio-reporting-service
    build:
      context: ./services/reporting-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-reporting-service:dev
    environment:
      PORT: 3059
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_reporting?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      PATIENT_SERVICE_URL: http://patient-service:3053
      APPOINTMENT_SERVICE_URL: http://appointment-service:3054
      BILLING_SERVICE_URL: http://billing-service:3056
      STAFF_SERVICE_URL: http://staff-service:3069
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      patient-service:
        condition: service_started
      appointment-service:
        condition: service_started
      billing-service:
        condition: service_started
    networks:
      - ordella-physio-network

  audit-service:
    profiles: ["portal"]
    container_name: ordella-physio-audit-service
    build:
      context: ./services/audit
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-audit-service:dev
    environment:
      PORT: 3070
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_audit?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ordella-physio-network

  user-role-service:
    profiles: ["portal"]
    container_name: ordella-physio-user-role-service
    build:
      context: ./services/user-role-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-user-role-service:dev
    environment:
      PORT: 3068
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_user_role?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ordella-physio-network

  organization-service:
    profiles: ["portal"]
    container_name: ordella-physio-organization-service
    build:
      context: ./services/organization-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-organization-service:dev
    environment:
      PORT: 3066
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_organization?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      SSO_ENCRYPTION_KEY: *jwt-secret
      TENANT_SERVICE_URL: http://tenant-service:3052
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
    networks:
      - ordella-physio-network

  terminal-service:
    profiles: ["portal"]
    container_name: ordella-physio-terminal-service
    build:
      context: ./services/terminal-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-terminal-service:dev
    environment:
      PORT: 3067
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_terminal?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      TENANT_SERVICE_URL: http://tenant-service:3052
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
    networks:
      - ordella-physio-network

  staff-service:
    profiles: ["portal"]
    container_name: ordella-physio-staff-service
    build:
      context: ./services/staff-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-staff-service:dev
    environment:
      PORT: 3069
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_staff?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      TENANT_SERVICE_URL: http://tenant-service:3052
      USER_ROLE_SERVICE_URL: http://user-role-service:3068
      APPOINTMENT_SERVICE_URL: http://appointment-service:3054
      BILLING_SERVICE_URL: http://billing-service:3056
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
      user-role-service:
        condition: service_started
      appointment-service:
        condition: service_started
    networks:
      - ordella-physio-network

  pharmacy-service:
    profiles: ["portal"]
    container_name: ordella-physio-pharmacy-service
    build:
      context: ./services/pharmacy-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-pharmacy-service:dev
    environment:
      PORT: 3085
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_pharmacy?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      PATIENT_SERVICE_URL: http://patient-service:3053
      THERAPIST_SERVICE_URL: http://core-service:3051
      STAFF_SERVICE_URL: http://staff-service:3069
      APPOINTMENT_SERVICE_URL: http://appointment-service:3054
      AUDIT_SERVICE_URL: http://audit-service:3070
    depends_on:
      db:
        condition: service_healthy
      patient-service:
        condition: service_started
      core-service:
        condition: service_started
      staff-service:
        condition: service_started
      audit-service:
        condition: service_started
    networks:
      - ordella-physio-network

  file-storage-service:
    profiles: ["portal"]
    container_name: ordella-physio-file-storage-service
    build:
      context: ./services/file-storage
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-file-storage-service:dev
    environment:
      PORT: 3071
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_file_storage?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      CORS_ORIGIN: "*"
      STORAGE_DEFAULT_PROVIDER: LOCAL
      STORAGE_FAILOVER_PROVIDERS: S3,GCS,LOCAL
      STORAGE_LOCAL_BASE_PATH: /app/uploads/files
      FILE_STORAGE_PUBLIC_BASE_URL: http://localhost:3049/files
      FILE_STORAGE_SIGNED_URL_TTL_SECONDS: 60
      FILE_STORAGE_MAX_BYTES: 52428800
      S3_BUCKET: ordella-uploads-prod
      S3_REGION: eu-west-1
      # Set STORAGE_DEFAULT_PROVIDER=S3 and S3_ACCESS_KEY/S3_SECRET_KEY in production.
      AUDIT_SERVICE_URL: http://audit-service:3070
      BILLING_SERVICE_URL: http://billing-service:3056
      CLAMAV_ENABLED: "true"
      CLAMAV_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      clamav:
        condition: service_healthy
      db:
        condition: service_healthy
      audit-service:
        condition: service_started
    networks:
      - ordella-physio-network

  clamav:
    profiles: ["portal"]
    container_name: ordella-physio-clamav
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ordella-physio-network

  notes-service:
    profiles: ["portal"]
    container_name: ordella-physio-notes-service
    build:
      context: ./services/notes-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-notes-service:dev
    environment:
      PORT: 3055
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_notes?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      TENANT_SERVICE_URL: http://tenant-service:3052
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - ordella-physio-network

  messaging-service:
    profiles: ["portal"]
    container_name: ordella-physio-messaging-service
    build:
      context: ./services/messaging-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        workspace: .
    image: ordella-physio-messaging-service:dev
    environment:
      PORT: 3061
      DATABASE_URL: postgresql://physio:physio@db:5432/ordella_messaging?schema=public
      JWT_ACCESS_SECRET: *jwt-secret
      TENANT_SERVICE_URL: http://tenant-service:3052
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      tenant-service:
        condition: service_started
      redis:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - ordella-physio-network


# ---------------------------------------------------------
# OPTIONAL: Monolithic clinic backend (portal E2E without microservices)
# Usage: docker compose -f docker-compose.dev.yml up -d clinic-backend-db clinic-backend
# ---------------------------------------------------------

  clinic-backend-db:
    container_name: ordella-clinic-backend-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic_backend
    ports:
      - "${CLINIC_BACKEND_DB_PORT:-5434}:5432"
    volumes:
      - ordella-clinic-backend-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ordella-physio-network

  clinic-backend:
    container_name: ordella-clinic-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ordella-clinic-backend:latest
    ports:
      - "${CLINIC_BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@clinic-backend-db:5432/clinic_backend?schema=public
      JWT_SECRET: *jwt-secret
      JWT_REFRESH_SECRET: *jwt-secret
      TENANT_HEADER: x-tenant-id
    depends_on:
      clinic-backend-db:
        condition: service_healthy
    networks:
      - ordella-physio-network

  clinic-backend-backup-cron:
    profiles: ["backup"]
    container_name: ordella-clinic-backend-backup-cron
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - ordella-clinic-backend-backups:/app/backups
    environment:
      DATABASE_URL: postgresql://postgres:postgres@clinic-backend-db:5432/clinic_backend?schema=public
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-dev-backup-encryption-key-min-32-chars}
      BACKUP_OUTPUT_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
    depends_on:
      clinic-backend-db:
        condition: service_healthy
    command: >
      sh -c "apk add --no-cache postgresql-client openssl
      && mkdir -p /app/backups
      && echo \"$${BACKUP_CRON_SCHEDULE} /app/scripts/backup-run.sh\" > /etc/crontabs/root
      && crond -f -l 2"
    networks:
      - ordella-physio-network

# ---------------------------------------------------------
# NETWORKS & VOLUMES
# ---------------------------------------------------------
networks:
  ordella-physio-network:
    name: ordella-physio-network
    driver: bridge

volumes:
  ordella-physio-db-data:
  ordella-clinic-backend-db-data:
  ordella-clinic-backend-backups:
